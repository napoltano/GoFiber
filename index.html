<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoFiber</title>
<meta name="theme-color" content="#0284c7">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js?v=2"></script>
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GoFiber">
<style>
/* VOICE: strumento da cantiere, diretto, leggibile al sole sul telefono.
   IDEA: la bolla di lavoro del tecnico FTTH e il registro di magazzino a seriali.
   PICTURE: l'agenda con le fasce orarie grandi; nel magazzino le schede prodotto con le barre di giacenza.
   COLOUR and TYPE: palette di FiberTools (azzurro #0284c7 / indaco, notte #0b1220), giallo solo per l'anticipo; font di sistema.
   LAYOUT: barra app in alto, navigazione in basso su telefono, schede su una colonna sotto 760px. */
:root{color-scheme:light;--bf:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;--hf:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
--bg:#f3f6fb;--g1:rgba(14,165,233,.10);--g2:rgba(168,85,247,.07);--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--soft:#f8fafc;
--sh:0 1px 2px rgba(15,23,42,.04),0 8px 24px -8px rgba(15,23,42,.10);--pri:#0284c7;--pri2:#6366f1;--pris:#e0f2fe;--prink:#075985;
--bar:rgba(255,255,255,.82);--bar2:#eef4fb;--barink:#0f172a;--yel:#f5c400;--yink:#14171c;
--sirti:#1f5fd1;--valt:#8a4fd8;--sielte:#0e8a8a;--ok:#059669;--ko:#dc2626;--wait:#d97706;--neu:#64748b}
:root[data-theme=dark]{color-scheme:dark;--bg:#0b1220;--g1:rgba(56,189,248,.14);--g2:rgba(129,140,248,.12);--card:#121b2e;--ink:#e8eef8;--mute:#8a9bb5;--line:#22304a;--soft:#0f1727;
--sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px -10px rgba(0,0,0,.6);--pri:#38bdf8;--pri2:#818cf8;--pris:rgba(56,189,248,.12);--prink:#7dd3fc;
--bar:rgba(11,18,32,.82);--bar2:#121b2e;--barink:#e8eef8;--ok:#34d399;--ko:#f87171;--wait:#fbbf24;--neu:#8a9bb5}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(900px 500px at 0% -10%,var(--g1),transparent 60%),radial-gradient(700px 500px at 110% 10%,var(--g2),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.5 var(--bf);overflow-x:clip;transition:background .2s}
h1,h2,h3,h4,.cond{font-family:var(--hf);letter-spacing:-.02em;font-weight:750}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1160px;margin:0 auto;padding:0 max(4vw,14px)}
header.app{position:sticky;top:0;z-index:15;background:var(--bar);color:var(--barink);border-bottom:1px solid var(--line);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px)}
header.app .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo .mk{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px -6px var(--pri);display:grid;place-items:center}
.logo .mk{overflow:hidden;padding:0}.logo .mk svg{width:100%;height:100%;display:block}
.logo b{font-family:var(--hf);font-size:22px;font-weight:800;line-height:1;letter-spacing:-.02em}
.logo small{display:block;font-size:12px;opacity:.6;font-weight:400}
nav#tabs{display:flex;gap:4px;margin-inline-start:18px}
nav#tabs a{display:flex;align-items:center;gap:8px;text-decoration:none;padding:9px 14px;border-radius:10px;font-weight:600;font-size:15px;color:var(--mute);min-height:44px}
nav#tabs a:hover{color:var(--ink);background:var(--bar2)}
nav#tabs a.on{color:var(--prink);background:var(--pris)}
.hr{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.who{font-size:14px;background:var(--bar2);padding:7px 12px;border-radius:99px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.thm{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.thm:hover{background:var(--bar2)}
.thm.ft{width:auto;padding:0 12px;gap:7px;display:flex;align-items:center;text-decoration:none;font-weight:600;font-size:14px;color:var(--prink);background:var(--pris);border-color:color-mix(in srgb,var(--pri) 35%,transparent)}
@media(max-width:600px){.thm.ft span{display:none}.thm.ft{width:44px;padding:0;justify-content:center}}
main{padding-block:24px 90px}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{margin:0;font-size:clamp(32px,4.5vw,44px);line-height:1.02;font-weight:700}
.ph .sub{color:var(--mute);font-size:15px;text-transform:capitalize}
.ph .sp{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:var(--sh)}
.kpi b{display:block;font-family:var(--hf);font-size:34px;line-height:1;font-weight:700}
.kpi span{font-size:14px;color:var(--mute)}
.kpi.k-ko b{color:var(--ko)}.kpi.k-wait b{color:var(--wait)}.kpi.k-ok b{color:var(--ok)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;min-height:40px;cursor:pointer;font-size:15px;white-space:nowrap;font-weight:500}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.in{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;min-height:44px;font-size:16px;width:100%}
textarea.in{min-height:96px;resize:vertical}
.mono,code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.seg input:focus-visible+span{outline:3px solid var(--pri);outline-offset:2px}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(4,minmax(0,1fr));gap:8px;margin-bottom:6px}
.day{margin:24px 0 10px;display:flex;align-items:baseline;gap:10px}
.day h2{margin:0;font-size:23px;text-transform:capitalize}
.day span{color:var(--mute);font-size:14px}
.day::after{content:"";flex:1;height:1px;background:var(--line);align-self:center}
.day.past h2{color:var(--mute)}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 20px;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px 12px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--sh)}
.row:hover{border-color:var(--mute)}
.when{font-family:var(--hf);line-height:1;text-align:center;border-radius:10px;padding:10px 4px;background:color-mix(in srgb,var(--wait) 14%,transparent);align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.when b{display:block;font-size:28px;font-weight:700}
.when span{font-size:16px;color:var(--mute)}
.row.st-libera .when{background:color-mix(in srgb,var(--ko) 13%,transparent)}
.row.st-fatta .when{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.chev{color:var(--mute);font-size:24px}
.top2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.tag{font-size:12.5px;font-weight:700;color:#fff;padding:2px 9px;border-radius:6px}
.t-Assurance{background:#d13a2f;color:#fff}.t-Delivery{background:#14171c;color:#fff}:root[data-theme=dark] .t-Delivery{background:#eceef1;color:#14171c}
.seg.tipo input:checked+span.k-Assurance{background:#d13a2f;border-color:#d13a2f;color:#fff}
.antib{grid-column:1/-1;background:var(--yel);color:var(--yink);font-weight:700;font-size:14px;border-radius:8px;padding:6px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-2px -2px 2px}
.antib b{font-family:var(--hf);font-size:18px;letter-spacing:.06em}
.antibox{background:color-mix(in srgb,var(--yel) 22%,var(--card));border:2px solid var(--yel);border-radius:16px;padding:14px;margin:0 0 18px}
.antibox h2{margin:0 0 10px;font-size:26px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.antibox h2 span{background:var(--yel);color:var(--yink);padding:2px 10px;border-radius:8px;letter-spacing:.06em}
.ckline{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--yel) 16%,var(--card));border:1px solid var(--yel);border-radius:12px;padding:12px;margin-bottom:16px;cursor:pointer;font-size:15px}
.ckline input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:#c99f00}
tr[data-open]{cursor:pointer}tr[data-open]:hover td{background:var(--soft)}
.alink{text-decoration:none;color:inherit;display:inline-flex;align-items:center;gap:6px}
.alink:hover{color:var(--pri)}.alink svg{width:17px;height:17px;color:var(--pri)}
.plink{display:inline-flex;align-items:center;gap:4px;color:var(--pri);font-weight:600;text-decoration:none;background:var(--pris);padding:0 8px;border-radius:99px}
.plink svg{width:14px;height:14px}
.pfsok{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--pris);border:1px solid color-mix(in srgb,var(--pri) 35%,transparent);border-radius:12px;padding:10px 12px;margin:-6px 0 12px;font-size:15px}
.pfsok>svg{color:var(--pri)}.pfsok>div{flex:1 1 180px}
.sugl{display:grid;gap:4px;margin:-6px 0 12px}
.sug{display:flex;gap:10px;align-items:baseline;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px}
.sug:hover{border-color:var(--pri)}.sug span{color:var(--mute);font-size:13px}
.seg.esa input:checked+span.k-positiva{background:var(--ok);border-color:var(--ok);color:#fff}
.seg.esa input:checked+span.k-negativa{background:var(--ko);border-color:var(--ko);color:#fff}
.seg.esa input:checked+span.k-rimodulato{background:var(--wait);border-color:var(--wait);color:#fff}
.bars{display:flex;gap:3px;align-items:stretch;height:190px;padding-top:16px;overflow-x:auto}
.bcol{flex:1 0 18px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;min-width:18px}
.bcol.we .bl{color:var(--ko)}
.bst{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 2px 2px;overflow:hidden;min-height:0;background:transparent}
.bst i{display:block;min-height:0}
.bn{font-size:11px;color:var(--mute);margin-bottom:2px;min-height:14px}.bl{font-size:11px;color:var(--mute);margin-top:4px;white-space:nowrap}
tfoot td{border-top:2px solid var(--line)}
.dupw{background:color-mix(in srgb,var(--wait) 14%,transparent);border:1px solid color-mix(in srgb,var(--wait) 45%,transparent);border-radius:10px;padding:10px 12px;font-size:14px;margin:-4px 0 14px}.dupw b{font-weight:600}.dupw button{margin-inline-start:4px}
.r-OF{background:#13a538}.r-FC{background:#e2001a}
.seg.rete input:checked+span.k-OF{background:#13a538;border-color:#13a538;color:#fff}.seg.rete input:checked+span.k-FC{background:#e2001a;border-color:#e2001a;color:#fff}
.c-SIRTI{background:var(--sirti)}.c-Valtellina{background:var(--valt)}.c-SIELTE{background:var(--sielte)}
.pill{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.libera,.pill.ko{color:var(--ko);background:color-mix(in srgb,var(--ko) 13%,transparent)}
.pill.assegnata,.pill.wait{color:var(--wait);background:color-mix(in srgb,var(--wait) 15%,transparent)}
.pill.fatta,.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.neu{color:var(--neu);background:color-mix(in srgb,var(--neu) 14%,transparent)}
.addr{font-weight:600;font-size:17px}
.meta{font-size:14px;color:var(--mute);display:flex;flex-wrap:wrap;gap:2px 14px}
.meta b{color:var(--ink);font-weight:500}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:30px;text-align:center;color:var(--mute)}
.btn{border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer;background:var(--card);font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.yel{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent;box-shadow:0 8px 20px -10px var(--pri)}
.btn.dng{color:var(--ko);border-color:color-mix(in srgb,var(--ko) 45%,transparent);background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:wait}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,26px);box-shadow:var(--sh)}
.card h3{margin:0 0 10px;font-size:24px}
form.pf{max-width:740px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
label.f{display:block;font-size:14px;font-weight:600;margin-bottom:14px}
label.f>.in{margin-top:6px}
.lbl{font-size:14px;font-weight:600;margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;min-height:46px;padding:8px 16px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-weight:600}
.seg input:checked+span{background:var(--pri);color:#fff;border-color:var(--pri)}
.seg.comm input:checked+span.k-SIRTI{background:var(--sirti);border-color:var(--sirti);color:#fff}
.seg.comm input:checked+span.k-Valtellina{background:var(--valt);border-color:var(--valt);color:#fff}
.seg.comm input:checked+span.k-SIELTE{background:var(--sielte);border-color:var(--sielte);color:#fff}
.seg.fasce{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.seg.fasce span{font-family:var(--hf);font-size:21px;flex-direction:column;line-height:1.1;padding:8px}
.seg.fasce small{font-size:15px;opacity:.7}
.req{color:var(--ko)}
.err{color:var(--ko);font-size:14px;min-height:20px;margin:6px 0}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;align-items:center}
.ov{position:fixed;inset:0;background:rgba(6,8,10,.6);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:30;overflow-y:auto}
.mod{background:var(--bg);border-radius:18px;width:min(700px,100%);padding:clamp(16px,3vw,26px);position:relative;border:1px solid var(--line)}
.mod h3{margin:0 0 4px;font-size:30px;line-height:1.05;padding-inline-end:44px}
.x{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;border:0;background:transparent;font-size:26px;cursor:pointer}
dl.kv{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:8px 12px;margin:14px 0;font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
dl.kv dt{color:var(--mute)}dl.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.esito{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
.esito h4{margin:0 0 8px;font-size:22px;color:var(--ok)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:6px 0 12px}
.gal .th{aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--soft);border:1px solid var(--line);position:relative;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;text-decoration:none}
.gal img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.gal img.broken{display:none}
.gal .rm{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
.up,.sbox{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--card)}
.fh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
.sval{display:grid;gap:4px;margin-top:8px;max-height:260px;overflow-y:auto}
.sv{display:flex;gap:10px;align-items:center;font-size:14px;padding:4px 8px;border-radius:8px;background:var(--soft)}
.sv code{flex:none;font-size:14px}.sv span{color:var(--mute)}
.sv.ko span{color:var(--ko)}.sv.ok span{color:var(--ok)}.sv.wait span{color:var(--wait)}
.big img{max-width:100%;max-height:80vh;display:block;margin:0 auto;border-radius:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:40;font-weight:500;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.note{font-size:14px;color:var(--mute)}
.tlist{display:grid;gap:8px}
.trow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--sh)}
.trow .nm{font-weight:600;font-size:17px;flex:1 1 180px}
.steps{margin:0;padding-inline-start:20px}.steps li{margin-bottom:6px}
.msg{max-width:560px;margin:40px auto}
.subt{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;cursor:pointer;box-shadow:var(--sh);text-align:left;width:100%}
.prod:hover{border-color:var(--mute)}
.prod h4{margin:0;font-size:22px;line-height:1.1}
.prod .cod{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;margin:2px 0 10px}
.prod .cod svg{width:16px;height:16px}
.stock{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--soft);margin-bottom:8px}
.stock i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mute)}
.leg b{color:var(--ink);font-size:15px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px;vertical-align:1px}
table.t{width:100%;border-collapse:collapse;font-size:14px;background:var(--card)}
table.t th{text-align:left;color:var(--mute);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tw{border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--sh)}
.lnk{background:none;border:0;padding:0;color:var(--pri);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
details.grp{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:8px;box-shadow:var(--sh)}
details.grp summary{padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;list-style:none}
details.grp summary b{margin-inline-start:auto;font-family:var(--hf);font-size:26px}
details.grp .sl{padding:0 16px 14px;display:flex;flex-wrap:wrap;gap:6px}
details.grp code{background:var(--soft);padding:3px 8px;border-radius:6px;font-size:14px}
body.auth header.app,body.auth #localbar{display:none}
body.auth{background:radial-gradient(1100px 620px at 8% -12%,rgba(14,165,233,.38),transparent 62%),radial-gradient(900px 620px at 112% 112%,rgba(99,102,241,.34),transparent 62%),var(--bg);background-attachment:fixed}
body.auth main{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:28px 16px calc(28px + env(safe-area-inset-bottom))}
.authcard{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:28px;padding:30px 26px;box-shadow:0 34px 70px -34px rgba(2,132,199,.55)}
.authhead{text-align:center;margin-bottom:22px}

.authlogo svg{width:100%;height:100%;display:block}
.authhead h1{margin:16px 0 2px;font-size:40px;letter-spacing:-.03em}
.authhead p{margin:0;color:var(--mute)}
.authcard .subt{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px;display:grid;grid-template-columns:1fr 1fr;gap:4px}

.authcard .subt .chip.on{background:var(--card);color:var(--prink);box-shadow:var(--sh)}
.authcard .btn.yel{width:100%;min-height:50px;font-size:16px}
.authfoot{text-align:center;font-size:13px;color:var(--mute);margin-top:16px}
.auththm{position:fixed;top:14px;right:14px;z-index:5}
@media(max-width:860px){.filters{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.filters .q{grid-column:1/-1}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

  header.app .wrap{flex-wrap:wrap;gap:8px 12px;padding-top:8px}
  nav#tabs{order:3;width:100%;margin:0 0 8px;overflow-x:auto;scrollbar-width:none;gap:6px}
  nav#tabs::-webkit-scrollbar{display:none}
  nav#tabs a{flex:none;padding:8px 12px;font-size:14px;background:var(--bar2)}
  nav#tabs a.on{background:var(--pris)}
  .logo small,.who{display:none}
}
@media(max-width:600px){.grid2{grid-template-columns:minmax(0,1fr)}.seg.fasce{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:74px minmax(0,1fr);gap:10px}.chev{display:none}.when b{font-size:24px}.when span{font-size:15px}dl.kv{grid-template-columns:minmax(0,1fr)}dl.kv dt{margin-top:6px}
  table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 10px;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-7.5em;color:var(--mute);white-space:normal}.stack td:empty{display:none}}

<script>

const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};

const dayName=s=>{const t=today(),d=parse(s);const base=d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:d.getFullYear()!==new Date().getFullYear()?'numeric':undefined});return s===t?'Oggi · '+base:s===addDays(t,1)?'Domani · '+base:base};

const fascia=k=>F[FI[k]]||{a:'--:--',b:''};
const sk=s=>'s-'+s.replace(/[^A-Za-z0-9_\-.:@+]/g,c=>'~'+c.charCodeAt(0).toString(16));

const LOGO='<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"> <defs> <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset=".55" stop-color="#0284c7"/><stop offset="1" stop-color="#4f46e5"/></linearGradient> <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".35" stop-color="#e0f2fe" stop-opacity=".55"/><stop offset="1" stop-color="#e0f2fe" stop-opacity="0"/></radialGradient> <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient> </defs> <rect width="512" height="512" rx="112" fill="url(#bg)"/> <rect width="512" height="512" rx="112" fill="url(#shine)"/> <g fill="none" stroke-linecap="round"> <path d="M86 352 C170 352 186 176 256 176 S342 352 426 352" stroke="#fff" stroke-opacity=".18" stroke-width="58"/> <path d="M86 352 C170 352 186 176 256 176 S342 352 426 352" stroke="#fff" stroke-width="26"/> <path d="M86 392 C170 392 190 236 256 236 S342 392 426 392" stroke="#7dd3fc" stroke-width="9" stroke-opacity=".9"/> <path d="M86 312 C170 312 182 128 256 128 S342 312 426 312" stroke="#c7d2fe" stroke-width="9" stroke-opacity=".75"/> </g> <circle cx="256" cy="176" r="74" fill="url(#glow)"/> <circle cx="256" cy="176" r="22" fill="#fff"/> <circle cx="148" cy="303" r="10" fill="#fff"/> <circle cx="364" cy="303" r="10" fill="#fff"/> </svg>';
const authHead=sub=>`<div class="authhead"><div class="authlogo">${LOGO}</div><h1>GoFiber</h1><p>${sub||'Pratiche e magazzino FTTH'}</p></div>`;
function setAuth(on){document.body.classList.toggle('auth',!!on);let t=document.getElementById('auththm');if(on&&!t){t=document.createElement('button');t.id='auththm';t.className='thm auththm';t.setAttribute('aria-label','Cambia tema');t.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');document.body.appendChild(t);t.innerHTML=ic(document.documentElement.dataset.theme==='dark'?'sun':'moon')}else if(!on&&t)t.remove()}

function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('pf-theme',t)}catch(e){}const a=document.getElementById('auththm');if(a)a.innerHTML=ic(t==='dark'?'sun':'moon');const b=$('#thm');b.innerHTML=ic(t==='dark'?'sun':'moon');b.title=t==='dark'?'Tema chiaro':'Tema scuro'}
{let t=null;try{t=localStorage.getItem('pf-theme')}catch(e){}if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';setTheme(t)}

const S={db:null,user:null,assets:null,admin:false,me:null,state:'load',

  view:'agenda',editId:null,f:{range:'oggi',day:'',stato:'',comm:'',tipo:'',tec:'',q:''},
  mag:{tab:'prodotti',prod:null,pst:'',pq:'',q:'',mode:'ser',comm:'',lastComm:''},ar:{q:'',mese:'',tipo:'',comm:'',tec:''},rep:{per:'mese',ref:new Date().toISOString().slice(0,10),comm:'',tipo:'',tec:''},repMine:false,imp:{txt:'',rows:null,skip:true,def:{tipo:'',comm:'',rete:'',data:'',fascia:'',tec:''}},nuovaMode:'one',modal:null,up:null,dupOk:null,needReg:null,busy:false};

const tecsOf=p=>Array.isArray(p?.tecnici)?p.tecnici:(p?.tecnicoId?[p.tecnicoId]:[]);

const pk=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const navLL=(lat,lng)=>`https://www.google.com/maps/dir/?api=1&destination=${Number(lat).toFixed(6)},${Number(lng).toFixed(6)}`;

async function pool(items,fn,n,onp){let i=0,done=0;const errs=[];const w=async()=>{while(i<items.length){const it=items[i++];try{await fn(it)}catch(e){errs.push([it,e])}done++;onp&&onp(done)}};await Promise.all(Array.from({length:Math.min(n,items.length)},w));return errs}

let zxP=null;
function loadZX(){return zxP||(zxP=new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=()=>ok(window.ZXing);s.onerror=()=>{zxP=null;ko(new Error('lib'))};document.head.appendChild(s)}))}
async function scanFile(file){
  if('BarcodeDetector' in window){try{const d=new BarcodeDetector();const b=await createImageBitmap(file);const r=await d.detect(b);if(r.length)return r.map(x=>x.rawValue)}catch(e){}}

  try{const rd=new ZX.BrowserMultiFormatReader();const r=await rd.decodeFromImageUrl(url);return [r.getText()]}catch(e){return []}finally{URL.revokeObjectURL(url)}
}
document.addEventListener('change',async e=>{
  const inp=e.target.closest('input[data-scan]');if(!inp)return;
  const tgt=document.getElementById(inp.dataset.scan);const files=[...inp.files];inp.value='';if(!tgt||!files.length)return;
  toast('Lettura codice in corso…');const found=[];
  for(const f of files){try{found.push(...await scanFile(f))}catch(x){}}

  if(tgt.tagName==='TEXTAREA'){tgt.value=(tgt.value.trim()?tgt.value.trim()+'\n':'')+found.join('\n')}else tgt.value=found[0];

function filtered(){
  const f=S.f,t=today();let lo=null,hi=null;
  if(f.range==='oggi')lo=hi=t;else if(f.range==='domani')lo=hi=addDays(t,1);else if(f.range==='sett'){lo=t;hi=addDays(t,6)}else if(f.range==='giorno'&&f.day)lo=hi=f.day;
  const q=f.q.trim().toLowerCase();const out=[];
  for(const [id,p] of S.pr){
    if(!S.admin&&!tecsOf(p).includes(S.me))continue;
    const st=statoOf(id,p);
    if(f.range==='aperte'&&!(p.data<t&&st!=='fatta'))continue;
    if(lo&&(p.data<lo||p.data>hi))continue;
    if(f.stato&&st!==f.stato)continue;
    if(f.comm&&p.committente!==f.comm)continue;
    if(f.tipo&&p.tipo!==f.tipo)continue;

function findDups(ordine,idr){

    if(mo)out.push({id,p,campo:'ordine'});if(mr)out.push({id,p,campo:'ID risorsa'})}
  return out;
}
function showDups(){

    const miss=[!o.tipo&&'tipo di intervento (Assurance o Delivery)',!o.committente&&'committente',!o.rete&&'rete (Open Fiber o FiberCop)',!o.ordine&&'ordine',!o.data&&'data',!o.fascia&&'fascia oraria'].filter(Boolean);const er=$('#ferr');

    const btns=form.querySelectorAll('button');btns.forEach(b=>b.disabled=true);er.textContent='';const now=new Date().toISOString();
    try{
      if(S.editId){const old=S.pr.get(S.editId)||{};await S.db.doc('pratiche/'+S.editId).set({...old,...o,updatedAt:now})}
      else await S.db.collection('pratiche').add({...o,createdAt:now,updatedAt:now});

    }catch(x){er.textContent=errText(x);btns.forEach(b=>b.disabled=false)}

function bindCarica(){
  S.mag.preProd='';
  const sel=$('#cprod'),nw=$('#cnew'),form=$('#cform');
  sel.onchange=()=>{nw.hidden=sel.value!=='__new'};
  $('#ccod').oninput=e=>{const v=e.target.value.trim();const m=[...S.pd].find(([,p])=>p.codice&&p.codice===v);$('#cmatch').innerHTML=m?`Questo codice è già il prodotto <b>${esc(m[1].nome)}</b>: l'ho selezionato.`:'';if(m){sel.value=m[0];nw.hidden=true}};
  form.onsubmit=async e=>{
    e.preventDefault();const er=$('#cerr2'),btn=form.querySelector('button[type=submit]');er.textContent='';
    const comm=form.querySelector('[name=ccomm]:checked')?.value||'';if(!comm){er.textContent='Scegli il committente (SIRTI, Valtellina o SIELTE).';return}
    let pid=sel.value;const all=serials('car');const list=all.filter(s=>{const u=S.un.get(sk(s));return !u||u.stato==='scaricato'});
    let nome='',codice='';
    if(pid==='__new'){nome=$('#cnome').value.trim();codice=$('#ccod').value.trim();if(!nome){er.textContent='Inserisci il nome del prodotto.';return}
      const ex=[...S.pd].find(([,p])=>(p.nome||'').toLowerCase()===nome.toLowerCase());if(ex){pid=ex[0]}}
    if(pid!=='__new'&&!list.length){er.textContent=all.length?'Tutti i seriali sono già presenti in magazzino.':'Scansiona almeno un seriale.';return}
    const tid=$('#ctec').value;btn.disabled=true;S.busy=true;const now=new Date().toISOString();S.mag.lastComm=comm;
    try{
      if(pid==='__new'){btn.textContent='Creo prodotto…';const r=await S.db.collection('prodotti').add({nome,codice,createdAt:now});pid=r.id}
      const errs=await pool(list,s=>S.db.doc('unita/'+sk(s)).set({seriale:s,prodottoId:pid,committente:comm,stato:tid?'tecnico':'magazzino',tecnicoId:tid||'',praticaId:'',ordine:'',idRisorsa:'',createdAt:now,assignedAt:tid?now:'',installedAt:'',scaricatoAt:'',motivoScarico:'',notaScarico:''}),6,d=>btn.textContent=`Salvo ${d} di ${list.length}…`);
      S.busy=false;const ok=list.length-errs.length;
      toast(list.length?`${ok} pezzi ${comm} caricati in ${prodName(pid)}${tid?' e assegnati a '+tecName(tid):''}`:'Prodotto creato');
      if(errs.length){er.textContent=`${errs.length} seriali non salvati: ${errs.slice(0,5).map(x=>x[0]).join(', ')}…`}
      S.mag.preProd=pid;S.mag.tab='prodotti';S.mag.prod=pid;render();
    }catch(x){S.busy=false;er.textContent=errText(x)}
    btn.disabled=false;btn.textContent='Carica in magazzino';
  };
}

      if(n<1||n>av.length){er.textContent=`Quantità non valida: disponibili ${av.length}.`;return}keys=av.slice(0,n).map(u=>sk(u.seriale))}

    if(errs.length)er.textContent=`${errs.length} non salvati.`;else render();
  };

async function prep(file){
  if(file.type==='application/pdf'||/\.pdf$/i.test(file.name))return{blob:file,type:'application/pdf'};
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);bmp.close&&bmp.close();
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));if(b)return{blob:b,type:'image/jpeg'}}catch(x){}
  if(['image/jpeg','image/png','image/webp','image/gif'].includes(file.type))return{blob:file,type:file.type};
  throw new Error('Impossibile leggere il file '+file.name+': usa una foto JPG/PNG o un PDF.');
}

function parseKml(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('Il file non è un KML valido.');
  const ct=(el,tag)=>{for(const c of el.children)if(c.localName===tag)return(c.textContent||'').trim();return ''};
  const out=[];
  for(const pm of doc.getElementsByTagName('Placemark')){
    const name=ct(pm,'name');const ce=pm.getElementsByTagName('Point')[0]?.getElementsByTagName('coordinates')[0];if(!name||!ce)continue;
    const [lng,lat]=ce.textContent.trim().split(/[\s,]+/).map(Number);if(!isFinite(lat)||!isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180)continue;
    let p=pm.parentElement,folder='';while(p&&p.localName!=='Folder')p=p.parentElement;if(p)folder=ct(p,'name');
    const desc=ct(pm,'description').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    const ext={};for(const d of pm.getElementsByTagName('Data'))ext[d.getAttribute('name')]=(d.getElementsByTagName('value')[0]?.textContent||'').trim();
    const full=/\b([A-Z]{2,4}_\d{1,3}[\/\s-]\d{1,3}[EW]\d{1,3})\b/i.exec(desc);
    const n=(full?full[1]:name).toUpperCase().replace(/\s+/g,' ');
    const note=('note' in ext?ext.note:(/Specification\s*:/i.test(desc)?'':desc)).slice(0,120);
    out.push([n,ext.anello||folder||'',+lat.toFixed(6),+lng.toFixed(6),note]);
  }
  return out;
}
async function importPfs(file){
  const msg=$('#pfsMsg');const say=t=>{if(msg)msg.textContent=t};
  if(/\.kmz$/i.test(file.name)){say('Il file è KMZ: in FiberTools usa “Condividi posizioni”, che crea un file KML.');return}
  let items;try{items=parseKml(await file.text())}catch(x){say(x.message||'File non leggibile.');return}
  if(!items.length){say('Nessun PFS con coordinate trovato nel file.');return}
  const m=new Map();for(const [k,e] of S.pfsImp)m.set(k,[e.n,e.a,e.lat,e.lng,e.note]);
  const near=(a,b)=>Math.abs(a-b)<0.00002;
  let nuovi=0,agg=0;for(const r of items){const k=pk(r[0]);const o=S.pfs.get(k);if(!o)nuovi++;else if(!near(o.lat,r[2])||!near(o.lng,r[3]))agg++;else continue;m.set(k,r)}
  if(!nuovi&&!agg){say('Nessun PFS nuovo o spostato: le posizioni sono già aggiornate.');return}
  const all=[...m.values()].sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true}));const CH=S.remote?300:1500,n=Math.ceil(all.length/CH),at=new Date().toISOString();
  S.busy=true;
  try{
    for(let i=0;i<n;i++){say(`Salvo ${Math.min((i+1)*CH,all.length)} di ${all.length}…`);await S.db.doc('pfsdb/c'+i).set({items:all.slice(i*CH,(i+1)*CH),at})}
    for(const id of [...S.pfsDocs.keys()]){const i=+id.slice(1);if(!(i<n))await S.db.doc('pfsdb/'+id).delete()}
    S.busy=false;toast(`Posizioni PFS: ${nuovi} nuove, ${agg} spostate`);if(S.view==='nuova')render();
  }catch(x){S.busy=false;say(errText(x))}
}

function snapOf(id){const p=S.pr.get(id)||{};const t=tecsOf(p);return {rete:p.rete||'',ora:p.ora||'',rimod:Array.isArray(p.rimod)?p.rimod:[],pfsLat:p.pfsLat??null,pfsLng:p.pfsLng??null,pfsAnello:p.pfsAnello||'',tipo:p.tipo||'',committente:p.committente||'',ordine:p.ordine||'',idRisorsa:p.idRisorsa||'',indirizzo:p.indirizzo||'',telefono:p.telefono||'',pfs:p.pfs||'',permuta:p.permuta||'',splitter:p.splitter||'',data:p.data||'',fascia:p.fascia||'',tecnici:t,tecnicoId:t[0]||'',tecniciNomi:t.map(x=>tecName(x))}}
function archItems(){
  const a=S.ar,q=a.q.trim().toLowerCase(),out=[];
  for(const [id,e] of S.es){
    const p=S.pr.get(id)||e.snap;if(!p)continue;const team=tecsOf(p);
    if(!S.admin&&!team.includes(S.me)&&e.by!==S.me)continue;
    if(a.mese&&!(e.completedAt||'').startsWith(a.mese)&&!(p.data||'').startsWith(a.mese))continue;
    if(a.tipo&&p.tipo!==a.tipo)continue;if(a.comm&&p.committente!==a.comm)continue;
    if(S.admin&&a.tec&&!team.includes(a.tec))continue;
    const names=team.length?team.map(tecName).join(' + '):(p.tecniciNomi||[]).join(' + ');
    if(q&&![p.ordine,p.idRisorsa,p.indirizzo,p.pfs,e.permuta||p.permuta,e.splitter||p.splitter,p.telefono,names,(e.materiali||[]).join(' ')].join(' ').toLowerCase().includes(q))continue;
    out.push({id,p,e,names});
  }
  return out.sort((x,y)=>(y.e.completedAt||'').localeCompare(x.e.completedAt||''));
}

const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
async function apiCall(api,action,body){
  const r=await fetch(api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...body})});
  if(!r.ok)throw new Error('Il server non risponde ('+r.status+')');
  const j=await r.json();if(j.error)throw new Error(j.error);return j;
}
function loginHTML(api,msg){return `<form class="authcard" id="loginf" novalidate>${authHead()}

  <p class="note" id="lnote" style="margin:-4px 0 10px">Non hai un account? Scegli <b>Registrati</b>: il responsabile conferma il tuo accesso.</p>
  <div class="err" id="lerr">${esc(msg||'')}</div><button class="btn yel" type="submit" id="lgo">Accedi</button>

function waitServer(){return new Promise(res=>{
  setAuth(true);$('#main').innerHTML=`<form class="authcard" id="srvf" novalidate>${authHead()}<h3>Collega il server</h3><p class="note" style="margin-top:-4px">Solo la prima volta su questo dispositivo: incolla l'indirizzo dell'app web del Foglio Google (finisce con <code>/exec</code>). Te lo dà il responsabile.</p>
   <label class="f">Indirizzo del server<input class="in mono" name="api" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false"></label><div class="err" id="srverr"></div><button class="btn yel" type="submit">Continua</button></form>`;
  $('#srvf').onsubmit=async e=>{e.preventDefault();const u=String(new FormData(e.target).get('api')||'').trim(),er=$('#srverr');
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)){er.textContent='L\'indirizzo deve iniziare con https://script.google.com/';return}
    er.textContent='Verifica…';try{const r=await fetch(u);const j=await r.json();if(j.app!=='GoFiber')throw 0}catch(x){er.textContent='Non risponde come server GoFiber: controlla l\'indirizzo e che il deployment sia aperto a «Chiunque».';return}
    LS.set('gofiber-api',u);res(u)}})}
function waitLogin(api,msg){return new Promise(res=>{
  setAuth(true);$('#tabs').innerHTML='';$('#who').textContent='Accesso';
  $('#main').innerHTML=loginHTML(api,msg);let mode='login';const f=$('#loginf');
  $('#lmode').onclick=e=>{const b=e.target.closest('[data-lm]');if(!b)return;mode=b.dataset.lm;$('#lmode').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));$('#lpw2').hidden=mode!=='reg';$('#lgo').textContent=mode==='reg'?'Crea account':'Accedi';$('#lnote').innerHTML=mode==='reg'?'Dopo la registrazione inserisci nome e ruolo: il responsabile conferma il tuo accesso.':'Non hai un account? Scegli <b>Registrati</b>: il responsabile conferma il tuo accesso.'};
  $('#lchg').onclick=()=>{LS.set('gofiber-api',null);LS.set('gofiber-token',null);location.search='';location.reload()};
  f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f),em=String(fd.get('email')||'').trim(),pw=String(fd.get('password')||'');const er=$('#lerr');er.textContent='';
    if(!em||!pw){er.textContent='Inserisci email e password.';return}
    if(mode==='reg'&&pw!==String(fd.get('password2')||'')){er.textContent='Le due password non coincidono.';return}
    const b=$('#lgo');b.disabled=true;b.textContent='Attendi…';
    try{const r=await apiCall(api,mode==='reg'?'register':'login',{email:em,password:pw});LS.set('gofiber-token',r.token);res(r.token)}
    catch(x){er.textContent=x.message==='Failed to fetch'?'Impossibile raggiungere il server: controlla la connessione o l\'indirizzo.':x.message;b.disabled=false;b.textContent=mode==='reg'?'Crea account':'Accedi'}};
})}
async function remoteClaude(api){
  S.remote=true;S.api=api;let token=LS.get('gofiber-token'),me=null,msg='';
  for(;;){
    if(!token)token=await waitLogin(api,msg);
    try{me=await apiCall(api,'me',{token});break}catch(x){msg=x.message==='auth'?'Sessione scaduta: accedi di nuovo.':x.message;if(x.message==='auth'){token=null;LS.set('gofiber-token',null)}else{setAuth(true);$('#main').innerHTML=`<div class="authcard">${authHead()}<h3>Server non raggiungibile</h3><p>${esc(msg)}</p><div class="acts"><button class="btn yel" onclick="location.reload()">Riprova</button></div></div>`;await new Promise(()=>{})}}
  }
  S.email=me.email;S.token=token;
  const call=(a,b)=>apiCall(api,a,{token,...b}).catch(x=>{if(x.message==='auth'){LS.set('gofiber-token',null);location.reload()}throw x});
  S.call=call;
  const docs=new Map(),subs=[];let since=0,synced=false,syncing=null;
  const colOf=p=>p.split('/').slice(0,-1).join('/');
  const snap=c=>{const n=c.split('/').length+1;const out=[];for(const [k,v] of docs)if(k.startsWith(c+'/')&&k.split('/').length===n)out.push({id:k.split('/').pop(),exists:true,data:()=>v,metadata:{fromCache:false,hasPendingWrites:false}});return{docs:out.sort((a,b)=>a.id<b.id?-1:1),metadata:{fromCache:false,hasPendingWrites:false}}};
  const notify=cols=>subs.forEach(([c,f])=>{if(!cols||cols.has(c))try{f(snap(c))}catch(e){}});
  async function sync(){if(syncing)return syncing;syncing=(async()=>{try{const r=await call('sync',{since});const cols=new Set();
      for(const [p,j] of r.docs){cols.add(colOf(p));if(j==null)docs.delete(p);else try{docs.set(p,JSON.parse(j))}catch(e){}}
      since=r.now;const first=!synced;synced=true;notify(first?null:cols);S.netErr=false}catch(x){S.netErr=true}finally{syncing=null}})();return syncing}
  // scritture raggruppate
  let queue=[],timer=null;
  function flush(){const q=queue;queue=[];timer=null;if(!q.length)return;
    call('write',{ops:q.map(x=>x.op)}).then(r=>{const bad=new Set(r.errors||[]);q.forEach(x=>bad.has(x.op.path)?x.rej({code:'invalid_argument'}):x.res());if(bad.size)sync()},e=>{q.forEach(x=>x.rej({code:'unavailable',message:e.message}));since=0;docs.clear();sync()})}
  function write(op){const cols=new Set([colOf(op.path)]);
    if(op.op==='delete')docs.delete(op.path);else if(op.op==='update'){const c=docs.get(op.path);if(!c)return Promise.reject({code:'invalid_argument'});docs.set(op.path,deep(c,op.data))}else docs.set(op.path,JSON.parse(JSON.stringify(op.data)));
    notify(cols);return new Promise((res,rej)=>{queue.push({op,res,rej});if(queue.length>=150)flush();else if(!timer)timer=setTimeout(flush,80)})}
  const deep=(a,b)=>{const o={...a};for(const k in b){const v=b[k];o[k]=v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k])?deep(o[k],v):JSON.parse(JSON.stringify(v))}return o};
  const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const doc=p=>({id:p.split('/').pop(),path:p,get:async()=>{if(!synced)await sync();return{id:p.split('/').pop(),exists:docs.has(p),data:()=>docs.get(p)}},
    set:d=>write({op:'set',path:p,data:d}),update:d=>write({op:'update',path:p,data:d}),delete:()=>write({op:'delete',path:p})});
  const col=p=>({path:p,doc:id=>doc(p+'/'+(id||rid())),add:async d=>{const r=doc(p+'/'+rid());await r.set(d);return r},
    onSnapshot:f=>{const e=[p,f];subs.push(e);if(synced)setTimeout(()=>f(snap(p)),0);return()=>{const i=subs.indexOf(e);if(i>=0)subs.splice(i,1)}}});
  await sync();
  setInterval(()=>{if(document.visibilityState!=='hidden')sync()},12000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});
  const db={doc,collection:col};
  const user={isOwner:async()=>!!me.owner,canEdit:async()=>!!me.owner||(me.attivo&&me.ruolo==='admin'),id:async()=>me.id,can:async()=>true};
  const assets={upload:async(blob,o)=>{const b64=await new Promise((ok,ko)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(',')[1]);fr.onerror=ko;fr.readAsDataURL(blob)});
    try{const r=await call('upload',{b64,type:o?.type||blob.type,name:(blob.name||'foto')+'-'+Date.now()});return{id:r.id,url:bUrl(r.id),contentType:r.contentType,sizeBytes:blob.size}}catch(x){throw{code:'upstream_error',message:x.message}}}};
  return{use:async k=>k==='db'?db:k==='user'?user:k==='assets'?assets:null};
}
const bUrl=id=>String(id).startsWith('gd:')?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id.slice(3))+'&sz=w1600':'/_blob/'+id;
const bLink=id=>String(id).startsWith('gd:')?'https://drive.google.com/file/d/'+encodeURIComponent(id.slice(3))+'/view':'/_blob/'+id;
window.logout=()=>logout();
function logout(){const t=LS.get('gofiber-token');LS.set('gofiber-token',null);if(S.api&&t)apiCall(S.api,'logout',{token:t}).catch(()=>{}).finally(()=>location.reload());else location.reload()}

/* ---------- modalità locale (fuori da Claude, es. GitHub Pages) ---------- */
function localClaude(){
  S.local=true;const KEY='gofiber-db';let store={};try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
  const subs=[];const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){toast('Spazio del browser esaurito: esporta e libera i dati')}};
  const snap=p=>{const n=p.split('/').length+1;return{docs:Object.keys(store).filter(k=>k.startsWith(p+'/')&&k.split('/').length===n).sort().map(k=>({id:k.split('/').pop(),exists:true,data:()=>store[k],metadata:{fromCache:false,hasPendingWrites:false}})),metadata:{fromCache:false,hasPendingWrites:false}}};
  const notify=()=>subs.forEach(([p,f])=>{try{f(snap(p))}catch(e){}});
  addEventListener('storage',e=>{if(e.key===KEY){try{store=JSON.parse(e.newValue||'{}')}catch(x){}notify()}});
  const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const doc=p=>({id:p.split('/').pop(),path:p,get:async()=>({id:p.split('/').pop(),exists:p in store,data:()=>store[p]}),
    set:async d=>{store[p]=JSON.parse(JSON.stringify(d));save();notify()},
    update:async d=>{if(!(p in store))throw{code:'invalid_argument'};store[p]={...store[p],...JSON.parse(JSON.stringify(d))};save();notify()},
    delete:async()=>{delete store[p];save();notify()}});
  const col=p=>({path:p,doc:id=>doc(p+'/'+(id||rid())),add:async d=>{const r=doc(p+'/'+rid());await r.set(d);return r},
    onSnapshot:(f)=>{const e=[p,f];subs.push(e);setTimeout(()=>f(snap(p)),0);return()=>{const i=subs.indexOf(e);if(i>=0)subs.splice(i,1)}}});
  const db={doc,collection:col};
  const user={isOwner:async()=>true,canEdit:async()=>true,id:async()=>'locale',can:async()=>true};
  return{use:async k=>k==='db'?db:k==='user'?user:null};
}

/* ---------- avvio ---------- */
function sub(path,key,map){
  const t=setTimeout(()=>{if(!S.loaded[key]){S.slow=true;S.loaded[key]=true;live()}},10000);
  S.db.collection(path).onSnapshot(snap=>{
    map.clear();for(const d of snap.docs){let v=d.data();if(path==='pratiche')v=fixT(v);else if(path==='esiti'&&v?.snap?.tipo==='Guasto')v={...v,snap:fixT(v.snap)};map.set(d.id,v)}
    if(path==='pfsdb')rebuildPfs();
    if(!snap.metadata.fromCache){clearTimeout(t);S.loaded[key]=true;if(Object.values(S.loaded).every(Boolean))S.slow=false}
    live();
  },e=>{clearTimeout(t);S.loaded[key]=true;S.err=e?.code||'err';live()});
}
(async()=>{
  let api=new URLSearchParams(location.search).get('api');if(api){LS.set('gofiber-api',api);history.replaceState(null,'',location.pathname+location.hash)}
  api=(window.GOFIBER_API||'').trim()||LS.get('gofiber-api')||'';
  const inClaude=!!(window.claude&&typeof window.claude.use==='function');
  const wantLocal=new URLSearchParams(location.search).has('locale');
  if(!inClaude&&!api&&!wantLocal)api=await waitServer();
  const C=inClaude?window.claude:api?await remoteClaude(api):localClaude();
  setAuth(false);
  if(!inClaude&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  const [db,user,assets]=await Promise.all([C.use('db'),C.use('user'),C.use('assets')]);
  if(!db){S.state='nodb';render();return}
  S.db=db;S.user=user;S.assets=assets;
  S.isOwner=user?!!(await user.isOwner()):false;S.me=user?await user.id():null;S.canApprove=S.isOwner||(user?!!(await user.canEdit()):false);applyRole();
  const h=location.hash.slice(1);S.view=views().includes(h)?h:'agenda';
  S.state='ok';if(S.remote){const b=document.createElement('button');b.className='thm';b.title='Esci';b.setAttribute('aria-label','Esci');b.innerHTML='<svg class="i" viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></svg>';b.onclick=logout;$('.hr').appendChild(b)}
  if(S.local)$('#localbar').innerHTML='<div class="wrap"><div class="dupw" style="margin:12px 0 0"><b>Modalità locale.</b> I dati restano solo in questo browser e su questo dispositivo, senza foto e senza utenti condivisi. <button class=\"lnk\" id=\"connGs\">Collega il foglio Google</button> per lavorare in squadra.</div></div>';if($('#connGs'))$('#connGs').onclick=()=>{S.modal={type:'conn'};renderModal()};render();
  sub('tecnici','tec',S.tec);sub('ruoli','ro',S.roles);sub('pratiche','pr',S.pr);sub('esiti','es',S.es);sub('prodotti','pd',S.pd);sub('unita','un',S.un);sub('pfsdb','pfsx',S.pfsDocs);loadPfsBase();
})();
}
